<title>About — Inspire Wellness Therapy</title>

<link rel="stylesheet" href="site.css" />
<style>
  /* about page — page-specific styles */
  /* hero — taller, balanced breathing room (no CTA button) */
  .ab-hero { display: flex; align-items: center; min-height: 64vh; }
  .ab-hero .mm-hero__in { padding-top: 88px; padding-bottom: 104px; width: 100%; }
  @media (max-width: 700px) { .ab-hero { min-height: 0; } .ab-hero .mm-hero__in { padding-top: 64px; padding-bottom: 76px; } }
  .ab-hero__note { color: rgba(255,255,255,.72); font-size: 15px; font-weight: 500; letter-spacing: .01em; margin: 34px 0 0; }

  .ab-prose { max-width: 760px; margin-left: auto; margin-right: auto; }
  .ab-prose p { font-size: 16.5px; }

  /* directories ribbon */
  .ab-dirs { margin-top: 48px; padding-top: 30px; border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .ab-dirs__lab { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); }
  .ab-dirs__logos { width: 100%; max-width: 680px; height: auto; display: block; }

  /* core values — CALM grid */
  .ab-values { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 56px; }
  @media (max-width: 900px) { .ab-values { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .ab-values { grid-template-columns: 1fr; } }
  .ab-value { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px 26px 30px; box-shadow: var(--shadow-card); text-align: center; display: flex; flex-direction: column; align-items: center; transition: transform .22s var(--ease-out), box-shadow .22s var(--ease-out), border-color .22s var(--ease-out); }
  .ab-value:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: transparent; }
  .ab-value__tile { width: 68px; height: 68px; border-radius: 18px; background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 38px; line-height: 1; color: var(--accent); margin-bottom: 20px; }
  .ab-value h3 { font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--brand-strong); margin: 0 0 10px; }
  .ab-value p { color: var(--text-soft); font-size: 14.5px; line-height: 1.62; margin: 0; }

  /* founder block */
  .ab-afterblock { margin-top: 18px; }
  .mm-imgsplit > div > p { color: var(--text-soft); font-size: 16.5px; line-height: 1.75; margin: 18px 0 0; }
  .mm-imgsplit h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.1; color: var(--brand-strong); margin: 14px 0 0; letter-spacing: -.015em; }
  .mm-imgsplit h2 em { color: var(--accent); font-style: italic; }
  .ab-founder__cta { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 30px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="data.js"></script>
  <script type="text/babel" src="icons.js"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="about.jsx"></script>
</body>
</html>
